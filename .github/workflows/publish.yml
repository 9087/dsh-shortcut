name: Publish to npm

# Publishes dsh-shortcut with npm Trusted Publishing (GitHub OIDC, no NPM_TOKEN).
# Setup once on npmjs.com: package dsh-shortcut -> Settings -> Trusted publishing ->
#   Publisher: GitHub Actions
#   Organization or user: 9087
#   Repository: dsh-shortcut
#   Workflow filename: publish.yml
#   Environment: (leave empty)
# The normal trigger is the tag `pnpm run release` pushes (v<package.json version>):
# release-it bumps, commits, tags and pushes, this job publishes the version with
# provenance, proves the served artifact, and then creates the GitHub Release. A
# GitHub Release created by hand, or a manual run, publishes too.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and pack, but do not upload
        type: boolean
        default: false

permissions:
  # `write` is what creating the Release below needs. The release page is made HERE,
  # by the bot, rather than by release-it locally: that keeps one release per version
  # and makes its notes come from the commits since the previous tag.
  contents: write
  # Required for Trusted Publishing / provenance: npm exchanges this OIDC token.
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional manual approval gate: create an "npm" environment in the repo settings
    # and uncomment this line. Trusted publishing also accepts the environment name
    # in its npmjs configuration if you use one.
    # environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Check the tarball contents
        run: npm pack --dry-run

      # A release or a version tag must not publish a mismatched version.
      - name: Check the tag matches package.json
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json ${expected}."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - name: Upgrade npm
        run: npm install --global npm@latest

      # Re-running a failed job must be able to FINISH what it started. `npm publish` refuses
      # a version that already exists, so without this check a re-run dies at the upload and
      # never reaches the verify + Release steps below — which is exactly what happened to
      # 0.3.1 (run 4: publish ok, verify red because of a cached 404, Release skipped, and no
      # way to retry the tail). Skipping the upload is safe rather than lenient: the verify
      # step still proves the SERVED artifact was built from THIS commit (`--expect-git-head`),
      # so a re-tagged or wrong version fails there instead.
      - name: Check whether this version is already on the registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published: skipping the upload, verifying what is served."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is not on the registry yet: this run publishes it."
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry_run == true }}
        run: npm publish --dry-run --provenance --access public --registry=https://registry.npmjs.org

      - name: Publish
        if: ${{ inputs.dry_run != true && steps.registry.outputs.exists != 'true' }}
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org

      # Read back what the registry actually serves. A green publish step only proves the
      # upload was accepted; this proves the tarball's files, its manifest and the
      # published client bundle are the ones this commit built. The script polls while the
      # fresh version propagates, and fails the job when the served artifact differs. It
      # runs on a re-run too, which is what keeps the skip above honest.
      - name: Verify the published artifact
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/verify-release.mjs "$version" --expect-git-head "$GITHUB_SHA"

      # Last, so a Release page only ever exists for a version whose served artifact was
      # just proven above. `.release-it.json` sets `github.release: false` for exactly
      # this reason: release-it pushes the tag, and this job creates the one release.
      # `if` keeps it off a branch dispatch, where there is no tag to release. The action
      # matches by tag, so a re-run (or a page created by hand) is updated, not duplicated.
      - name: Create the GitHub Release
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
